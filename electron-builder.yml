appId: uy.recibos.app
productName: Recibos de sueldo
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# better-sqlite3 13 is N-API with bundled prebuilds; no rebuild against Electron is needed.
npmRebuild: false
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
# Migrations are read at runtime from process.resourcesPath/drizzle.
extraResources:
  - from: drizzle
    to: drizzle
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
portable:
  artifactName: Recibos-de-sueldo-${version}-portable.${ext}
nsis:
  artifactName: Recibos-de-sueldo-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
# Writes resources/app-update.yml and dist/latest.yml for electron-updater. CI uploads the
# files itself (--publish never); artifact names have no spaces so latest.yml matches the
# asset names on GitHub.
publish:
  provider: github
  owner: marcobaldi97
  repo: uy-paycheck-generator
